<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2621">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ROOT">
<title>Root Coffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E2621;--bg2:#153229;--bg3:#1D4033;--line:rgba(241,239,230,.11);--txt:#F1EFE6;--dim:#9CB2A8;--crema:#EBB24E;--crema-ink:#2B1B06;--ok:#7FD8A9;--late:#FF9460;--bad:#FF6B6B;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Be Vietnam Pro",-apple-system,Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
#app{max-width:440px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
header{display:flex;justify-content:space-between;align-items:baseline}
.brand{font-weight:700;font-size:17px;letter-spacing:.01em}
.brand span{font-weight:300;color:var(--dim);margin-left:6px}
#ngay{font-size:14px;color:var(--dim)}
.clock{display:flex;align-items:baseline;margin:14px 0 18px;font-variant-numeric:tabular-nums}
#gio{font-size:76px;font-weight:300;line-height:1;letter-spacing:-.03em}
#giay{font-size:24px;font-weight:300;color:var(--dim);margin-left:4px}
.ribbon{position:relative;margin-bottom:6px;padding-top:8px}
.segs{display:flex;gap:4px}
.seg{flex:1;height:34px;border-radius:9px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--dim);transition:background .3s,color .3s}
.seg.me{background:var(--crema);color:var(--crema-ink);font-weight:700}
.mark{position:absolute;top:0;bottom:18px;width:2px;margin-left:-1px;background:var(--txt);border-radius:2px;transition:left .6s linear}
.mark:before{content:"";position:absolute;top:-2px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--txt)}
.hrs{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
main{flex:1;display:flex;flex-direction:column;margin-top:22px}
h1.h{font-size:28px;line-height:1.2;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
p.sub{margin:0 0 18px;color:var(--dim);font-size:15px;line-height:1.5}
ul.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ul.list li{display:flex;align-items:center;gap:14px;min-height:66px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
ul.list li:active{background:var(--bg2)}
.av{width:42px;height:42px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex:none}
.nm{flex:1;font-size:18px;font-weight:500}
.cadot{font-size:14px;color:var(--dim)}
.cadot.on{color:var(--crema);font-weight:600}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--dim);font:inherit;font-size:15px;padding:6px 0;margin:-6px 0 10px;cursor:pointer}
.dots{display:flex;gap:16px;justify-content:center;margin:20px 0 8px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--dim);transition:all .15s}
.dots i.f{background:var(--txt);border-color:var(--txt)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
#pmsg{min-height:22px;text-align:center;font-size:14px;color:var(--bad);margin-bottom:10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:320px;margin:0 auto;width:100%}
.pad button{height:68px;border-radius:20px;border:0;background:var(--bg2);color:var(--txt);font:inherit;font-size:28px;font-weight:400;cursor:pointer;transition:background .12s,transform .12s}
.pad button:active{background:var(--bg3);transform:scale(.96)}
.pad button.ghost{background:none}
.blk{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.blk .t{display:flex;justify-content:space-between;align-items:center;gap:10px}
.blk b{font-size:20px;font-weight:600}
.blk .g{font-size:15px;color:var(--dim);margin-left:8px;font-variant-numeric:tabular-nums}
.blk .d{display:flex;gap:22px;margin-top:12px;font-size:15px;font-variant-numeric:tabular-nums}
.blk .d span{color:var(--dim);margin-right:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:99px;background:rgba(241,239,230,.08);white-space:nowrap}
.chip:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:rgba(127,216,169,.12)}
.chip.late{color:var(--late);background:rgba(255,148,96,.13)}
.chip.bad{color:var(--bad);background:rgba(255,107,107,.13)}
.chip.mute{color:var(--dim)}
.cta{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:74px;border:0;border-radius:24px;background:var(--crema);color:var(--crema-ink);font:inherit;font-size:21px;font-weight:700;cursor:pointer;margin-top:6px;transition:transform .12s,filter .12s}
.cta:active{transform:scale(.98);filter:brightness(.94)}
.cta[disabled],.cta.off{background:var(--bg2);color:var(--dim);cursor:default;font-weight:500;font-size:16px;text-align:center;padding:0 18px;line-height:1.35}
.cta.ghost{background:none;border:1.5px solid var(--line);color:var(--txt);height:58px;font-size:17px;font-weight:600}
.note{margin:12px 2px 0;color:var(--dim);font-size:14px;line-height:1.5;text-align:center}
.seg2{display:flex;background:var(--bg2);border-radius:14px;padding:4px;margin:14px auto 0;width:max-content}
.seg2 button{border:0;background:none;color:var(--dim);font:inherit;font-size:14px;font-weight:500;padding:8px 18px;border-radius:10px;cursor:pointer}
.seg2 button.on{background:var(--bg3);color:var(--txt)}
h2.s{font-size:15px;font-weight:600;margin:28px 0 8px;color:var(--dim)}
.wk{border-top:1px solid var(--line)}
.wk div{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.wk .a{color:var(--dim)}
.top{display:flex;justify-content:space-between;align-items:center}
.out{background:none;border:0;color:var(--dim);font:inherit;font-size:14px;padding:6px 0;cursor:pointer}
canvas#pv{width:100%;border-radius:var(--r);background:#000;display:block;margin-bottom:14px}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:30px}
.done svg{width:96px;height:96px;margin-bottom:18px}
.done circle{fill:none;stroke:var(--ok);stroke-width:3;stroke-dasharray:252;stroke-dashoffset:252;animation:dr .6s ease-out forwards}
.done path{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dr .4s .45s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.done h1{margin:0 0 8px;font-size:26px;font-weight:600}
.done p{margin:0 0 24px;color:var(--dim);font-size:16px;line-height:1.5}
.done .cta{max-width:260px}
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,30px);max-width:380px;width:calc(100% - 40px);background:var(--txt);color:var(--bg);padding:13px 16px;border-radius:14px;font-size:15px;font-weight:500;line-height:1.4;opacity:0;pointer-events:none;transition:all .25s;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
.camw{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:3/4;max-height:62vh;width:100%}
#vid{width:100%;height:100%;object-fit:cover;display:block}
#vid.mir{transform:scaleX(-1)}
.camb{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.cbtn{min-width:72px;height:44px;border:0;border-radius:14px;background:rgba(241,239,230,.16);color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;backdrop-filter:blur(6px)}
.shut{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.25);cursor:pointer;padding:0;position:relative}
.shut:after{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff;transition:transform .1s}
.shut:active:after{transform:scale(.88)}
.bdg{background:var(--crema);color:var(--crema-ink);font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.lb{display:block;margin:16px 2px 6px;font-size:14px;color:var(--dim)}
.lb b{color:var(--txt);font-weight:600}
select,textarea,input.t{width:100%;background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit;font-size:16px;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}
textarea{resize:none}
input[type=range]{width:100%;accent-color:var(--crema);height:36px;margin:2px 0}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
.thumb{width:100%;max-height:200px;object-fit:cover;border-radius:14px;margin-bottom:8px;display:block}
.sm{font-size:13px;color:var(--dim);margin-top:8px}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.cta.sm2{height:46px;font-size:15px;border-radius:14px;margin-top:0}
.cta.ghost.sm2{height:46px;font-size:15px}
.tbl{border-top:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.tbl div{display:grid;grid-template-columns:1.5fr .5fr .6fr .6fr .5fr .9fr 1.2fr;gap:6px;padding:9px 2px;border-bottom:1px solid var(--line);align-items:center}
.tbl .th{color:var(--dim);font-size:12px}
#app.wide{max-width:560px}
.hn{display:grid;grid-template-columns:1.2fr 1fr auto;gap:8px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.hn small{display:block;color:var(--dim);font-size:12px}
.lk{color:var(--crema);font-size:13px}
.load{color:var(--dim);padding:30px 0;text-align:center}
:focus-visible{outline:2px solid var(--crema);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.done circle,.done path{stroke-dashoffset:0}}
@media (max-height:700px){#gio{font-size:60px}.pad button{height:58px}}
#hero[hidden],#tabs[hidden],.tbl-bd[hidden]{display:none!important}
#app.tabs-on{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
header{padding-bottom:2px}
.lg{display:flex;flex-direction:column;align-items:stretch;margin-top:6vh}
.lgm{width:64px;height:64px;border-radius:20px;background:var(--crema);color:var(--crema-ink);font-weight:700;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;letter-spacing:-.02em}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;background:rgba(14,38,33,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 10px max(8px,env(safe-area-inset-bottom))}
#tabs .in{display:flex;width:100%;max-width:440px}
#tabs button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--dim);font:inherit;font-size:11.5px;font-weight:500;padding:8px 0 4px;cursor:pointer;border-radius:14px}
#tabs button svg{width:25px;height:25px}
#tabs button.on{color:var(--crema);font-weight:600}
#tabs .bd{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.pg{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.fld{margin-top:20px}
.fld>label{display:block;font-size:14px;font-weight:600;margin:0 2px 8px}
.fld .hp{font-size:12.5px;color:var(--dim);margin:7px 2px 0;line-height:1.45}
.cag{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cag button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:11px 0 9px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);color:var(--txt);font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.cag button small{font-size:10.5px;font-weight:400;color:var(--dim)}
.cag button.on{background:var(--crema);border-color:var(--crema);color:var(--crema-ink)}
.cag button.on small{color:rgba(43,27,6,.72)}
.amt{position:relative}
.amt input{width:100%;background:var(--bg2);color:var(--txt);border:1.5px solid var(--line);border-radius:16px;padding:16px 46px 16px 16px;font:inherit;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.amt input:focus{border-color:var(--crema);outline:0}
.amt i{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--dim);font-size:18px}
input[type=date].t{min-height:50px}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px;padding:16px 18px;border-radius:var(--r);background:var(--bg3)}
.tot span{font-size:14px;color:var(--dim)}
.tot b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
#sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;background:rgba(0,0,0,.6)}
#sheet.on{display:flex}
#sheet .sh{width:100%;max-width:440px;margin:0 auto;background:var(--bg2);border-radius:26px 26px 0 0;padding:10px 20px max(22px,env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet .gr{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 16px}
#sheet h2{margin:0 0 12px;font-size:21px;font-weight:600}
.kv{display:flex;justify-content:space-between;gap:14px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:15px}
.kv span{color:var(--dim)}
.kv b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.me{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.me .av{width:56px;height:56px;font-size:19px}
.me b{font-size:22px;font-weight:600}
.row2{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);font-size:15px}
.row2 .a{color:var(--dim);font-size:14px}
.bd[hidden]{display:none!important}

.cta.big{height:96px;font-size:24px;border-radius:28px;margin-top:2px}
.cta.off.big{height:auto;min-height:74px;padding:16px 18px}
#tabs .in{position:relative}
#tabs button.fab{flex:0 0 86px;padding:0;overflow:visible;color:var(--crema-ink)}
#tabs button.fab.on{color:var(--crema-ink)}
.fabc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:68px;height:68px;border-radius:50%;background:var(--crema);margin:-36px auto 0;border:4px solid var(--bg);font-size:11px;font-weight:700;color:var(--crema-ink);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fabc svg{width:24px;height:24px}
.lw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px -20px 0;padding:0 20px 4px}
.wkn{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.wkn button{background:var(--bg2);border:0;color:var(--txt);width:42px;height:42px;border-radius:12px;font-size:22px;cursor:pointer}
.sch{border-collapse:separate;border-spacing:0;font-size:11px;font-variant-numeric:tabular-nums}
.sch th,.sch td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;padding:0}
.sch td{width:21px;min-width:21px;height:28px}
.sch th.dh{padding:5px 0;font-weight:600;font-size:11px;background:var(--bg2);border-top:1px solid var(--line)}
.sch th.dh small{display:block;font-weight:400;color:var(--dim);font-size:10px}
.sch th.ch{font-weight:500;color:var(--dim);font-size:10px;height:18px;background:var(--bg2)}
.sch th.nm1{position:sticky;left:0;z-index:2;background:var(--bg);text-align:left;padding:0 8px;min-width:84px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;font-size:12px;border-left:1px solid var(--line)}
.sch tr.myrow th.nm1{color:var(--crema);font-weight:700;background:#26361f}
.sch tr.myrow td.e{background:rgba(235,178,78,.1)}
.sch th.dh.tdy{background:var(--crema);color:var(--crema-ink)}
.sch th.dh.tdy small{color:var(--crema-ink)}
.sch td.e.tdy{background:rgba(235,178,78,.16)}
.sch td.on.tdy{box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.sch td.dg,.sch th.dh{border-right:2px solid rgba(241,239,230,.3)}
.sch td.mine{cursor:pointer}
.sch tr.ft td,.sch tr.ft th.nm1{font-size:11px;font-weight:600;color:var(--dim)}
.sch tr.ft td.ok{color:var(--ok)}
.sch tr.ft td.lo{color:var(--bad)}

.sch td{width:27px;min-width:27px;height:34px;border-right:1px solid rgba(241,239,230,.28);border-bottom:1px solid rgba(241,239,230,.22)}
.sch th{border-right:1px solid rgba(241,239,230,.28);border-bottom:1px solid rgba(241,239,230,.22)}
.sch td.dg,.sch th.dg{border-right:3px solid rgba(235,178,78,.75)}
.sch th.dh{font-size:12px;padding:6px 0}
.sch th.dh.p0{background:#1d4033}
.sch th.dh.p1{background:#2b5a48}
.sch td.e.p0{background:#112d26}
.sch td.e.p1{background:#1b3f33}
.sch th.ch{height:22px;font-size:11px;font-weight:700}
.sch th.c1{background:rgba(142,197,255,.3);color:#d6ebff}
.sch th.c2{background:rgba(127,216,169,.3);color:#d4f6e5}
.sch th.c3{background:rgba(255,148,96,.3);color:#ffe0d0}
.sch th.c4{background:rgba(201,155,255,.3);color:#eddcff}
.sch td.on{box-shadow:inset 0 0 0 1px rgba(14,38,33,.45)}
.sch th.dh.tdy{background:var(--crema);color:var(--crema-ink)}
.sch td.e.tdy.p0,.sch td.e.tdy.p1{background:rgba(235,178,78,.3)}
.sch tr.myrow td.e.p0,.sch tr.myrow td.e.p1{outline:0}
.sch tr.myrow td{border-top:1px solid rgba(235,178,78,.8);border-bottom:1px solid rgba(235,178,78,.8)}
.sch tr.ft td{height:26px}

#land{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:hidden}
#land .rot{position:absolute;top:0;left:100vw;width:100vh;width:100dvh;height:100vw;transform-origin:top left;transform:rotate(90deg);padding:8px 12px;display:flex;flex-direction:column}
#land .rot.flat{left:0;width:100vw;height:100vh;transform:none}
#land .lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:15px}
#land .lw{margin:0;padding:0;overflow:auto;flex:1}
#land .sch{table-layout:fixed;width:100%}
#land .sch td{min-width:0;width:auto;height:30px}
#land .sch th.nm1{width:78px;min-width:78px;max-width:78px}

#goland{display:none!important}
@media (orientation:landscape){#app.lw2{max-width:none}}
#land .rot{padding:6px 12px}
#land #lbody{flex:1;min-height:0;overflow:auto}
#land .lh .seg2 button{padding:6px 14px}
#land .wkn{margin-top:6px}
#land .sub{margin:6px 0 !important;font-size:13px}
#land .blk{margin-bottom:6px}
.ltoast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:500;max-width:80%;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.ltoast.on{opacity:1}

#land .rot{left:var(--W,100vw);width:var(--H,100dvh);height:var(--W,100vw)}
#land .sch td{height:25px}

days.forEach(function(d,di){h+='<th colspan="4" class="dh dg p'+(di%2)+(d.iso===o.hom?" tdy":"")+'">'+esc(thuNgan(d.thu))+'<small>'+esc(d.dm)+'</small></th>'});
h+='</tr><tr>';
days.forEach(function(d,di){for(var c=1;c<=4;c++)h+='<th class="ch c'+c+(c===4?" dg":"")+'">'+c+'</th>'});
h+='</tr>';
names.forEach(function(n){var me=n===S.ten,g=grid(n)||[],col=colOf(names,n),ed=o.edit&&me;

h+='</tr>'});
if(can){h+='<tr class="ft"><th class="nm1">Cần</th>';for(var i=0;i<28;i++)h+='<td'+(i%4===3?' class="dg"':'')+'>'+(can[i]==null?"":can[i])+'</td>';h+='</tr>'}

for(var i=0;i<28;i++){var k=0;names.forEach(function(n){var g=grid(n);if(g&&g[i])k++});var need=can?(+can[i]||0):0;h+='<td class="'+(k>=need?"ok":"lo")+(i%4===3?" dg":"")+'">'+k+'</td>'}
h+='</tr></table></div>';return h}

S.lc=r;S.lw=r.tu;drawTuan()}).catch(function(){if($("lbody"))$("lbody").innerHTML='<p class="note">Mất kết nối. Thử lại sau vài giây.</p>'})}

h+='<p class="sm">Ca 1: 5:30–9:30 · Ca 2: 9:30–13:30 · Ca 3: 13:30–17:30 · Ca 4: 17:30–21:30. Dòng của bạn nổi bật, ngày hôm nay màu vàng. Dòng Cần so với số người đã có: đỏ là còn thiếu.</p>';
